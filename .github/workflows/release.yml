name: Release

on:
  push:
    tags:
      - "oms-v*"
  workflow_dispatch:
    inputs:
      rehearsal:
        description: "Verification only: manual runs never publish, regardless of this value"
        required: false
        default: true
        type: boolean
      plugin_validation_attestation:
        description: "Emergency fallback: JSON attestation (or path) used when the Claude CLI cannot run here"
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OMS_REQUIRE_PLUGIN_VALIDATION: "1"
      OMS_PLUGIN_VALIDATION_ATTESTATION: ${{ inputs.plugin_validation_attestation }}
      OMS_MEASUREMENT_REQUIRED: "1"
      OMS_MEASUREMENT_ATTESTATION_REQUIRED: "1"
      OMS_MEASUREMENT_RELEASE: "1"
      OMS_MEASUREMENT_PROFILE: "boost-c040"
      OMS_MEASUREMENT_MANIFEST: "docs/measurements/boost-c040.json"
      OMS_PREREG_QRELS_HASH: ${{ vars.OMS_PREREG_QRELS_HASH }}
      OMS_MEASUREMENT_TRUSTED_PUBLIC_KEY: ${{ secrets.OMS_MEASUREMENT_TRUSTED_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Guard tag matches every version carrier
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').version")
          CLAUDE=$(node -p "require('./.claude-plugin/plugin.json').version")
          CODEX=$(node -p "require('./.codex-plugin/plugin.json').version")
          HERMES=$(node -p "require('./assets/hermes-manifest.json').version")
          MKT_TOP=$(node -p "require('./.claude-plugin/marketplace.json').version")
          MKT_PLUGIN=$(node -p "require('./.claude-plugin/marketplace.json').plugins[0].version")
          echo "tag=$GITHUB_REF_NAME package.json=$PKG claude=$CLAUDE codex=$CODEX hermes=$HERMES marketplace=$MKT_TOP marketplace.plugins[0]=$MKT_PLUGIN"
          if [ "$GITHUB_REF_NAME" != "oms-v$PKG" ] \
            || [ "$CLAUDE" != "$PKG" ] \
            || [ "$CODEX" != "$PKG" ] \
            || [ "$HERMES" != "$PKG" ] \
            || [ "$MKT_TOP" != "$PKG" ] \
            || [ "$MKT_PLUGIN" != "$PKG" ]; then
            echo "::error::version carriers are out of lockstep with the tag"
            echo "  tag                                          = $GITHUB_REF_NAME (expected oms-v$PKG)"
            echo "  package.json                                 = $PKG"
            echo "  .claude-plugin/plugin.json = $CLAUDE"
            echo "  .codex-plugin/plugin.json  = $CODEX"
            echo "  assets/hermes-manifest.json = $HERMES"
            echo "  .claude-plugin/marketplace.json (version)      = $MKT_TOP"
            echo "  .claude-plugin/marketplace.json (plugins[0])   = $MKT_PLUGIN"
            exit 1
          fi

      - run: npm ci

      - name: Install Claude CLI for plugin validation
        run: |
          set -uo pipefail
          if npm install -g @anthropic-ai/claude-code && claude --version; then
            echo "claude CLI available; release:check will run the real plugin validation"
            exit 0
          fi
          if [ -n "${ATTESTATION:-}" ]; then
            echo "::warning::Claude CLI unavailable; falling back to the provided plugin_validation_attestation input"
            exit 0
          fi
          echo "::error::ENVIRONMENT failure: could not install or run the Claude CLI (@anthropic-ai/claude-code)."
          echo "Remediation: run 'claude plugin validate .' locally and either"
          echo "  (a) commit the attestation file at .oms-release/plugin-validation.json, or"
          echo "  (b) re-run this workflow via workflow_dispatch with the plugin_validation_attestation input set."
          echo "Do NOT disable OMS_REQUIRE_PLUGIN_VALIDATION."
          exit 1
        env:
          ATTESTATION: ${{ inputs.plugin_validation_attestation }}

      - name: Required R2 Phase D measurement gate (boost-c040)
        run: npm run check:measurement

      - run: npm run release:check

  publish:
    # Dispatch is verification-only, including dispatch on an existing tag.
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/oms-v') && needs.verify.result == 'success'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Rebuild the exact commit verified above; no cross-job artifact is trusted.
      - run: npm ci
      - run: npm run build

      - name: Publish to npm with provenance
        # Authentication comes from npm Trusted Publishing via GitHub OIDC.
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').version")
          rc=0
          node scripts/npm-version-exists.mjs "$V" || rc=$?
          case "$rc" in
            0)
              echo "oh-my-second-brain@$V already published - idempotent re-run, skipping publish"
              ;;
            1)
              npm publish --provenance --access public
              ;;
            *)
              echo "::error::registry check failed (exit $rc); refusing to publish on an inconclusive result"
              exit "$rc"
              ;;
          esac

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').version")
          node scripts/extract-release-notes.mjs "$V" > /tmp/notes.md
          gh release view "$GITHUB_REF_NAME" \
            || gh release create "$GITHUB_REF_NAME" \
              --title "oms v$V" \
              --notes-file /tmp/notes.md \
              --verify-tag
