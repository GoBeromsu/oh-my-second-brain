name: CI

on:
  push:
    branches: [main]
  # No base-branch filter. A pull request stacked on another feature branch is
  # still a pull request that must build and pass tests; filtering to [main]
  # meant every intermediate PR in a stack merged with no signal at all.
  pull_request:

jobs:
  # Pull-request lane only. Release verification (pack, artifact smoke, plugin
  # validate) is NOT run here: .github/workflows/release.yml already runs the
  # full `npm run release:check` chain on `oms-v*` tags, so running it per merge
  # duplicated that work three times over the Node matrix for no added signal.
  check:
    runs-on: ubuntu-latest
    env:
      OMS_MEASUREMENT_REQUIRED: "1"
      OMS_MEASUREMENT_ATTESTATION_REQUIRED: "1"
      OMS_MEASUREMENT_RELEASE: "1"
      OMS_MEASUREMENT_PROFILE: "boost-c040"
      OMS_MEASUREMENT_MANIFEST: "docs/measurements/boost-c040.json"
      OMS_PREREG_QRELS_HASH: ${{ vars.OMS_PREREG_QRELS_HASH }}
      OMS_MEASUREMENT_TRUSTED_PUBLIC_KEY: ${{ secrets.OMS_MEASUREMENT_TRUSTED_PUBLIC_KEY }}
    strategy:
      # Don't let one version's failure cancel the others -- we want the full
      # per-version signal, not a fail-fast cancellation that masks real results.
      fail-fast: false
      matrix:
        # Matches package.json engines (>=20). Node 18 is excluded on purpose:
        # node-llama-cpp (>=20) pulls a string-width that uses the RegExp `v`
        # flag, which Node 18's V8 cannot parse (npm ci fails at postinstall).
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: node scripts/changelog-history-guard.mjs
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run check:docs
      - name: Required R2 Phase D measurement gate (boost-c040)
        run: npm run check:measurement
      - run: npm run audit
