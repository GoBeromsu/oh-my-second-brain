name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  release-check:
    runs-on: ubuntu-latest
    strategy:
      # Don't let one version's failure cancel the others -- we want the full
      # per-version signal, not a fail-fast cancellation that masks real results.
      fail-fast: false
      matrix:
        # Matches package.json engines (>=20). Node 18 is excluded on purpose:
        # node-llama-cpp (>=20) pulls a string-width that uses the RegExp `v`
        # flag, which Node 18's V8 cannot parse (npm ci fails at postinstall).
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: node scripts/changelog-history-guard.mjs
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run audit
      - run: npm run release:pack
      - run: npm run release:artifact-smoke
      - run: npm run release:plugin
